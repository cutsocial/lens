name: Validate study files

on:
  pull_request:
    paths:
      - "public/experiments/**"
      - "public/locales/**"
      - "public/images/**"
      - "schema/**"
      - "scripts/validate-studies.js"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master]
    paths:
      - "public/experiments/**"
      - "public/locales/**"
      - "schema/**"
      - "scripts/validate-studies.js"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run validate

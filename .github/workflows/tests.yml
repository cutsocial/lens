name: Tests

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master]
    paths:
      - "src/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm test
